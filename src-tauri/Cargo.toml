[package]
name = "neurobrowser-tauri"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Gates the neurobrowser-headless bin only. The bin is a Tokio Unix-socket
# listener and does not use the Tauri runtime.
headless = []
# Cargo cannot cfg-gate crate features on debug_assertions. Keep inspector
# off by default; enable with `--features devtools` in local debug builds.
devtools = ["tauri/devtools"]

[[bin]]
name = "neurobrowser-headless"
path = "src/bin/headless.rs"
required-features = ["headless"]

[dependencies]
neurobrowser = { path = "..", features = [] }
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
