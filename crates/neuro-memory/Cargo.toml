[package]
name = "neuro-memory"
version = "0.1.0"
edition = "2021"
description = "Persistent page memory for NeuroBrowser"

# Independent crate. Not a Cargo workspace member.
# Root and src-tauri path dependencies land in M1.7.

# scraper used by extract_blocks (M1.3). sha2/serde_json/tokio fs back the page
# store (M1.4). tantivy (M1.5) and async-trait (M1.7) unused until those milestones.
[dependencies]
async-trait = "0.1"
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
