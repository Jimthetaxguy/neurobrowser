name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: "Check: fmt + clippy + test + build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo build (release)
        run: cargo build --release

  tauri:
    name: "Tauri: frontend build + cargo check"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-tauri/package-lock.json

      - name: npm ci
        working-directory: src-tauri
        run: npm ci

      - name: npm build
        working-directory: src-tauri
        run: npm run build

      - name: cargo check tauri
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: cargo check tauri (headless)
        run: cargo check --manifest-path src-tauri/Cargo.toml --features headless --locked

      - name: cargo test headless
        run: cargo test --manifest-path src-tauri/Cargo.toml --features headless --locked --bin neurobrowser-headless

      - name: cargo test webview capabilities
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test runtime_capabilities

  guards:
    name: "Guards: no-mock + merge conflicts + iCloud"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # grep is on ubuntu-latest; never wrap it in `if`/`2>/dev/null` — a
      # missing tool must fail the job, not skip the scan.
      # nullglob: crates/ is present before any crate manifest exists.
      - name: No-mock dependency guard
        run: |
          set -euo pipefail
          shopt -s nullglob
          set +e
          grep -n -F -e mockall -e mockito -e wiremock -- \
            Cargo.toml Cargo.lock src-tauri/Cargo.toml src-tauri/Cargo.lock \
            crates/*/Cargo.toml crates/*/Cargo.lock
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Mock crates are forbidden."
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::no-mock scan failed (exit $rc)."
            exit "$rc"
          fi

      - name: Merge conflict detection
        run: |
          set -euo pipefail
          set +e
          grep -R -n -I -E '<<<<<<<|>>>>>>>' --exclude='*.lock' \
            src src-tauri tests NeuroBrowser crates
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Unresolved merge conflict markers found."
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::conflict scan failed (exit $rc)."
            exit "$rc"
          fi

      - name: iCloud duplicate detection
        run: |
          set -euo pipefail
          dupes=$(find src src-tauri tests NeuroBrowser crates -name '* 2*')
          if [ -n "$dupes" ]; then
            echo "$dupes"
            echo "::error::iCloud duplicate files detected."
            exit 1
          fi
