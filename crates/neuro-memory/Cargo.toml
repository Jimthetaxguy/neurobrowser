[package]
name = "neuro-memory"
version = "0.1.0"
edition = "2021"
description = "Persistent page memory for NeuroBrowser"

# Independent crate. Not a Cargo workspace member.
# Root and src-tauri path dependencies land in M1.7.

# sha2 (M1.4) and async-trait (M1.7 trait impls) are declared here and unused
# until those milestones. scraper is used by extract_blocks (M1.3). tantivy is
# used by the block index (M1.5). async-trait 0.1 only accepts trait impls, so
# MemoryService methods are inherent async fns.
[dependencies]
async-trait = "0.1"
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tantivy = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
